      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
    H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
  }
  return H.map((x) => x.toString(16).padStart(8, "0")).join("");
}

// BR-10 자기 검사. C-1,C-2,C-4,C-5,C-6/BR-07,C-7,C-8을 이 챕터 데이터에 대해 수행한다.
function runContentSelfCheck(content, sourceText) {
  const failures = [];
  const fail = (code, message) => failures.push({ code, message });

  const requiredArrays = ["readingCards", "concepts", "stages", "boardItems", "propositions", "premises", "counterexamples", "arguments", "inquiries"];
  for (const key of requiredArrays) {
    if (!Array.isArray(content[key])) fail("SCHEMA", `ChapterContent.${key}: 배열 필드 누락/형식 오류`);
  }
  for (const key of ["schemaVersion", "sourceVersion", "sourceHash", "chapterId", "title", "openingQuestion"]) {
    if (content[key] === undefined || content[key] === null || content[key] === "") fail("SCHEMA", `ChapterContent.${key}: 필수 필드 누락`);
  }

  const collections = ["readingCards","concepts","boardItems","propositions","premises","counterexamples","arguments","inquiries"];
  const ids = {};
  for (const key of collections) ids[key] = new Set();

  function checkSrc(label, id, src) {
    if (!src || !Number.isInteger(src.from) || !Number.isInteger(src.to)) { fail("C-1", `${label} ${id}: src 누락/형식 오류`); return; }
    if (src.from > src.to) fail("C-2", `${label} ${id}: src.from > src.to`);
    if (src.from < 1 || src.to > sourceText.lineCount) fail("C-2", `${label} ${id}: src(${src.from}-${src.to})가 원문 범위(1-${sourceText.lineCount})를 벗어남`);
  }
  function checkClaimType(label, id, claimType) {
    if (!["source", "interpretation", "model"].includes(claimType)) fail("C-1", `${label} ${id}: claimType 값 오류(${claimType})`);
  }

  for (const key of collections) {
    for (const e of content[key] || []) {
      if (ids[key].has(e.id)) fail("SCHEMA", `${key}: id 중복 (${e.id})`);
      ids[key].add(e.id);
      checkSrc(key, e.id, e.src);
      checkClaimType(key, e.id, e.claimType);
    }
  }

  if (content.sourceVersion !== sourceText.version) fail("C-3", "콘텐츠 sourceVersion과 내장 원문 version이 일치하지 않습니다.");

  for (const item of content.boardItems || []) {
    for (const key of ["label", "rationale"]) {
      if (typeof item[key] !== "string" || item[key].length === 0) fail("SCHEMA", `boardItem ${item.id}: ${key} 필수 필드 오류`);
    }
    if (!item.truth || !["A", "E", "I", "O"].every((q) => typeof item.truth[q] === "boolean")) {
      fail("SCHEMA", `boardItem ${item.id}: truth 필수 필드 오류`);
      continue;
    }
    const res = evaluate(item.truth, RELATION_IDS);
    const violated = RELATION_IDS.filter((id) => !res[id]);
    if (violated.length > 0) fail("C-4", `boardItem ${item.id}: truth가 관계(${violated.join(", ")})를 위반함`);
  }

  for (const stage of content.stages || []) {
    if (!Number.isInteger(stage.stage) || !Array.isArray(stage.activeRelations) || !Array.isArray(stage.itemIds) || typeof stage.goal !== "string" || stage.goal.length === 0) {
      fail("SCHEMA", `stage ${stage.stage}: stage/activeRelations/itemIds/goal 필수 필드 오류`);
    }
    for (const rid of stage.activeRelations || []) {
      if (!RELATION_IDS.includes(rid)) fail("C-5", `stage ${stage.stage}: 알 수 없는 관계 식별자 ${rid}`);
    }
    for (const iid of stage.itemIds || []) {
      if (!ids.boardItems.has(iid)) fail("C-8", `stage ${stage.stage}: itemIds가 존재하지 않는 boardItem(${iid})을 참조`);
    }
  }

  const derivable = (content.concepts || []).filter((c) => c.derivedFrom && c.derivedFrom.length > 0);
  if (derivable.length < 1) fail("C-7", "derivedFrom이 비어있지 않은 개념이 없음 (FR-02 계약 위반)");
  for (const c of derivable) {
    for (const dep of c.derivedFrom) {
      if (!ids.concepts.has(dep)) fail("C-7", `concept ${c.id}: derivedFrom이 존재하지 않는 개념(${dep})을 참조`);
    }
  }

  for (const prop of content.propositions || []) {
    for (const pid of prop.premiseIds) {
      if (!ids.premises.has(pid)) fail("C-8", `proposition ${prop.id}: premiseIds가 존재하지 않는 premise(${pid})를 참조`);
    }
  }
  const premiseIdSet = new Set((content.premises || []).map((p) => p.id));
  for (const cx of content.counterexamples || []) {
    if (!premiseIdSet.has(cx.defeats)) fail("C-8", `counterexample ${cx.id}: defeats가 존재하지 않는 premise(${cx.defeats})를 참조`);
    if (!["reading_complete","board_stage_1","board_stage_2","board_stage_3"].includes(cx.acquiredAt)) fail("SCHEMA", `counterexample ${cx.id}: acquiredAt 값 오류`);
  }
  for (const inq of content.inquiries || []) {
    for (const aid of inq.argumentIds) {
      if (!ids.arguments.has(aid)) fail("C-8", `inquiry ${inq.id}: argumentIds가 존재하지 않는 argument(${aid})를 참조`);
    }
  }
  for (const rc of content.readingCards || []) {
    for (const tok of rc.tokens || []) {
      if (!ids.concepts.has(tok.conceptId)) fail("C-8", `readingCard ${rc.id}: token이 존재하지 않는 개념(${tok.conceptId})을 참조`);
    }
  }

  for (const prop of content.propositions || []) {
    for (const pid of prop.premiseIds) {
      const defenders = (content.counterexamples || []).filter((cx) => cx.defeats === pid);
      if (defenders.length < 1) fail("C-6", `premise ${pid}: 이를 무너뜨릴 반례가 없음 (BR-07)`);
    }
  }

  return failures;
}

function verifySourceHash(content, sourceText) {
  const computed = sha256Hex(sourceText.lines.join("\n"));
  return computed === content.sourceHash;
}

/* ==== SECTION: UI-HOME ==== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;" }[c]));
}
function claimTypeLabel(claimType) {
  return { source: "원문", interpretation: "해석", model: "모델" }[claimType] || claimType;
}
function claimTypeExplain(claimType) {
  return {
    source: "원문에 문자 그대로 존재하는 진술입니다.",
    interpretation: "원문을 해석·재구성한 진술입니다.",
    model: "게임 판정을 위해 채택한 형식화입니다. 원문의 사실이 아니라 게임의 규약입니다.",
  }[claimType] || "";
}

function renderHome(selfCheckFailures) {
  const statusNote = document.getElementById("chapter-status-note");
  const enterBtn = document.getElementById("btn-enter-chapter-3");
  const chapterEntry = document.getElementById("chapter-3-entry");
  const atlasButton = document.getElementById("nav-atlas");

  let diag = document.getElementById("self-check-diagnostics");
  if (selfCheckFailures.length > 0) {
    statusNote.textContent = `콘텐츠 자기 검사 실패 (${selfCheckFailures.length}건) — 아래 진단 정보를 확인하세요.`;
    statusNote.style.color = "var(--color-inconsistent)";
    enterBtn.disabled = true;
    enterBtn.textContent = "입장 불가 (검사 실패)";
    atlasButton.disabled = true;
    if (!diag) {
      diag = document.createElement("div");
      diag.id = "self-check-diagnostics";
      diag.className = "card";
      diag.style.marginTop = "12px";
      chapterEntry.after(diag);
    }
    diag.innerHTML = "<h3>진단 정보</h3><ul>" +
      selfCheckFailures.map((f) => `<li><strong>[${escapeHtml(f.code)}]</strong> ${escapeHtml(f.message)}</li>`).join("") +
      "</ul>";
    return;
  }

  if (diag) diag.remove();
  statusNote.textContent = "콘텐츠 자기 검사를 통과했습니다.";
  statusNote.style.color = "";
  enterBtn.disabled = false;
  enterBtn.textContent = "입장";
  enterBtn.onclick = () => enterChapter3();
  atlasButton.disabled = false;
  atlasButton.onclick = () => openAtlas();
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach((el) => { el.hidden = el.dataset.screen !== name; });
}

/* ==== SECTION: UI-READING ==== */
let readingCursor = 0;
let synthesisSelection = new Set();

function enterChapter3() {
  const progress = getChapterProgress(CHAPTER_CONTENT.chapterId);
  progress.status = "in_progress";
  if (progress.flowSteps[1] !== "done") progress.flowSteps[1] = "done";
  if (progress.flowSteps[2] === "inactive") progress.flowSteps[2] = "active";
  readingCursor = 0;
  showScreen("Reading");
  renderReadingScreen();
}

function renderReadingScreen() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);

  if (isReadingComplete(progress, content)) {
    grantReadingCompletionRewards(progress, content);
    progress.flowSteps[2] = "done";
    if (progress.flowSteps[3] === "inactive") progress.flowSteps[3] = "active";
  }

  const screen = document.getElementById("screen-reading");
  const card = content.readingCards[readingCursor];
  const total = content.readingCards.length;
  const isLast = readingCursor === total - 1;
  const consumedCount = progress.readingConsumed.length;
  const complete = isReadingComplete(progress, content);

  screen.innerHTML = `
    <button type="button" class="back-link" id="btn-reading-home">◂ 서재</button>
      <h1>${escapeHtml(content.title)}</h1>
    <p class="opening-question term-serif">${escapeHtml(content.openingQuestion)}</p>
    <div class="reading-progress">읽음 ${consumedCount} / ${total}</div>
    <div class="card reading-card">
      <div class="reading-meta">
        <span class="badge-claim" data-claim="${card.claimType}">${claimTypeLabel(card.claimType)}</span>
        <button type="button" class="btn btn-secondary btn-source" data-src-from="${card.src.from}" data-src-to="${card.src.to}" data-claim="${card.claimType}" data-title="리딩 카드 ${readingCursor + 1}">원문 보기</button>
      </div>
      <p class="reading-body">${renderTokenizedBody(card)}</p>
    </div>
    <div class="reading-nav">
      <button type="button" class="btn btn-secondary" id="btn-reading-prev" ${readingCursor === 0 ? "disabled" : ""}>이전</button>
      <button type="button" class="btn" id="btn-reading-next">${isLast ? "완료" : "다음"}</button>
    </div>
    ${complete ? renderCompletionPanel(progress, content) : ""}
  `;

  document.getElementById("btn-reading-home").addEventListener("click", () => showScreen("Home"));
  document.getElementById("btn-reading-prev").addEventListener("click", () => {
    if (readingCursor > 0) { readingCursor--; renderReadingScreen(); }
  });
  document.getElementById("btn-reading-next").addEventListener("click", () => {
    consumeReadingCard(progress, card.id);
    if (!isLast) readingCursor++;
    renderReadingScreen();
  });

  wireReadingScreenEvents(progress, content);
}

function renderTokenizedBody(card) {
  const tokens = card.tokens || [];
  if (tokens.length === 0) return escapeHtml(card.body);
  let matches = [];
  for (const tok of tokens) {
    const idx = card.body.indexOf(tok.text);
    if (idx !== -1) matches.push({ start: idx, end: idx + tok.text.length, tok });
  }
  matches.sort((a, b) => a.start - b.start);
  const filtered = [];
  let lastEnd = -1;
  for (const m of matches) {
    if (m.start >= lastEnd) { filtered.push(m); lastEnd = m.end; }
  }
  let html = "";
  let cursor = 0;
  for (const m of filtered) {
    html += escapeHtml(card.body.slice(cursor, m.start));
    html += `<button type="button" class="term-token" data-concept-id="${escapeHtml(m.tok.conceptId)}">${escapeHtml(m.tok.text)}</button>`;
    cursor = m.end;
  }
  html += escapeHtml(card.body.slice(cursor));
  return html;
}

function renderCompletionPanel(progress, content) {
  const acquiredConceptCards = content.concepts.filter((c) => progress.acquiredConcepts.includes(c.id));
  const derivableLocked = content.concepts.filter((c) => c.derivedFrom.length > 0 && !progress.acquiredConcepts.includes(c.id));
  const acquiredCx = content.counterexamples.filter((cx) => progress.acquiredCounterexamples.includes(cx.id));

  return `
    <div class="card completion-panel">
      <h2>리딩 완료 — 획득한 카드</h2>
      <div class="concept-deck">
        ${acquiredConceptCards.map(renderConceptCard).join("")}
      </div>
      <h3>획득한 반례 카드</h3>
      <div class="counterexample-deck">
        ${acquiredCx.map((cx) => `
          <div class="card cx-card">
            <strong>${escapeHtml(cx.label)}</strong>
            <span class="badge-claim" data-claim="${cx.claimType}">${claimTypeLabel(cx.claimType)}</span>
            <button type="button" class="btn btn-secondary btn-source" data-src-from="${cx.src.from}" data-src-to="${cx.src.to}" data-claim="${cx.claimType}" data-title="${escapeHtml(cx.label)}">원문 보기</button>
          </div>
        `).join("")}
      </div>
      ${derivableLocked.length > 0 ? renderSynthesisPanel(progress, content) : ""}
      <button type="button" class="btn" id="btn-goto-board">대당 사각형 보드 퍼즐로</button>
    </div>
  `;
}

function renderConceptCard(c) {
  return `
    <div class="card concept-card">
      <div class="concept-terms">
        <span class="term-serif concept-ko">${escapeHtml(c.termKo)}</span>
        ${c.termLa ? `<span class="term-serif concept-la">${escapeHtml(c.termLa)}</span>` : ""}
      </div>
      <p class="concept-def">${escapeHtml(c.definition)}</p>
      <span class="badge-claim" data-claim="${c.claimType}">${claimTypeLabel(c.claimType)}</span>
      <button type="button" class="btn btn-secondary btn-source"
        data-src-from="${c.src.from}" data-src-to="${c.src.to}"
        data-claim="${c.claimType}" data-title="${escapeHtml(c.termKo)}">원문 보기</button>
    </div>
  `;
}

function renderSynthesisPanel(progress, content) {
  const ownedConcepts = content.concepts.filter((c) => progress.acquiredConcepts.includes(c.id));
  return `
    <div class="card synthesis-panel">
      <h3>개념 합성</h3>
      <p>보유한 개념 카드를 2개 이상 선택하고 합성을 시도하세요.</p>
      <div class="synthesis-select">
        ${ownedConcepts.map((c) => `
          <label class="synthesis-option">
            <input type="checkbox" class="synth-checkbox" value="${c.id}" ${synthesisSelection.has(c.id) ? "checked" : ""}>
            ${escapeHtml(c.termKo)}
          </label>
        `).join("")}
      </div>
      <button type="button" class="btn" id="btn-attempt-synthesis">합성 시도</button>
      <div id="synthesis-feedback"></div>
    </div>
  `;
}

function wireReadingScreenEvents(progress, content) {
  const gotoBoardBtn = document.getElementById("btn-goto-board");
  if (gotoBoardBtn) gotoBoardBtn.addEventListener("click", () => enterBoard());

  document.querySelectorAll(".term-token").forEach((el) => {
    el.addEventListener("click", () => openConceptPopup(el.dataset.conceptId));
  });
  document.querySelectorAll(".btn-source").forEach((el) => {
    el.addEventListener("click", () => openSourceOverlay({
      title: el.dataset.title,
      claimType: el.dataset.claim,
      src: { from: Number(el.dataset.srcFrom), to: Number(el.dataset.srcTo) },
    }));
  });
  document.querySelectorAll(".synth-checkbox").forEach((el) => {
    el.addEventListener("change", () => {
      if (el.checked) synthesisSelection.add(el.value); else synthesisSelection.delete(el.value);
    });
  });
  const synthBtn = document.getElementById("btn-attempt-synthesis");
  if (synthBtn) {
    synthBtn.addEventListener("click", () => {
      const result = attemptSynthesis(progress, content, Array.from(synthesisSelection));
      const feedback = document.getElementById("synthesis-feedback");
      if (result.success) {
        const names = result.acquired.map((id) => content.concepts.find((c) => c.id === id).termKo).join(", ");
        synthesisSelection.clear();
        renderReadingScreen();
        const fb2 = document.getElementById("synthesis-feedback");
        if (fb2) { fb2.textContent = `합성 성공: ${names}`; fb2.style.color = "var(--color-consistent)"; }
        return;
      }
      let msg = "합성 실패: ";
      if (result.reason === "need_at_least_two_cards") msg += "카드를 2개 이상 선택하세요.";
      else if (result.reason === "no_derivable_concepts_remaining") msg += "합성 가능한 개념이 더 이상 없습니다.";
      else if (result.reason === "missing_components") {
        const parts = Object.entries(result.perTargetMissing).map(([targetId, missing]) => {
          const targetName = content.concepts.find((c) => c.id === targetId).termKo;
          const missingNames = missing.map((id) => content.concepts.find((c) => c.id === id).termKo).join(", ");
          return `${targetName} — 필요한 구성 카드가 없거나 선택되지 않음: ${missingNames}`;
        });
        msg += parts.join(" / ");
      }
      feedback.textContent = msg;
      feedback.style.color = "var(--color-inconsistent)";
    });
  }
}

function openConceptPopup(conceptId) {
  const c = CHAPTER_CONTENT.concepts.find((x) => x.id === conceptId);
  if (!c) return;
  openSourceOverlay({
    title: c.termKo + (c.termLa ? ` (${c.termLa})` : ""),
    claimType: c.claimType,
    src: c.src,
    definition: c.definition,
  });
}

function openSourceOverlay({ title, claimType, src, definition }) {
  const overlay = document.getElementById("overlay-source");
  const panel = overlay.querySelector(".overlay-panel");
  const excerpt = SOURCE_TEXT.lines.slice(src.from - 1, src.to).join("\n");
  panel.innerHTML = `
    <div class="overlay-header">
      <h2 class="term-serif">${escapeHtml(title || "원문 보기")}</h2>

      <button type="button" class="btn btn-secondary" id="btn-close-source-overlay">닫기</button>

    ${definition ? `<p class="concept-def">${escapeHtml(definition)}</p>` : ""}
    <p class="claim-type-note">${claimTypeExplain(claimType)}</p>
    <pre class="source-excerpt">${escapeHtml(excerpt)}</pre>
    <p class="src-range">원문 ${src.from}${src.to !== src.from ? "–" + src.to : ""}행</p>
  `;
  overlay.hidden = false;
  document.getElementById("btn-close-source-overlay").addEventListener("click", () => { overlay.hidden = true; });
}

/* ==== SECTION: UI-ATLAS ==== */
function openAtlas() {
  const progress = getChapterProgress(CHAPTER_CONTENT.chapterId);
  const model = buildAtlasModel(CHAPTER_CONTENT, progress.acquiredConcepts);
  const overlay = document.getElementById("overlay-atlas");
  const panel = overlay.querySelector(".overlay-panel");
  const positions = new Map(model.nodes.map((node) => [node.id, node.pos]));
  const edges = model.edges.map((edge) => {
    const from = positions.get(edge.from);
    const to = positions.get(edge.to);
    return `<line class="atlas-edge" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" marker-end="url(#atlas-arrow)"><title>${escapeHtml(edge.from)} → ${escapeHtml(edge.to)}</title></line>`;
  }).join("");
  const nodes = model.nodes.map((node) => `
    <g class="atlas-node" transform="translate(${node.pos.x} ${node.pos.y})">
      <rect x="-92" y="-30" width="184" height="60" rx="6"></rect>
      <text x="0" y="-4" text-anchor="middle">${escapeHtml(node.termKo)}</text>
      <text class="atlas-node-la" x="0" y="16" text-anchor="middle">${escapeHtml(node.termLa || "")}</text>
      <title>${escapeHtml(node.definition)}</title>
    </g>
  `).join("");
  const cards = model.nodes.map((node) => `
    <article class="card atlas-card">
      <div class="concept-terms"><span class="term-serif concept-ko">${escapeHtml(node.termKo)}</span>${node.termLa ? `<span class="concept-la">${escapeHtml(node.termLa)}</span>` : ""}</div>
      <p>${escapeHtml(node.definition)}</p>
      <span class="badge-claim" data-claim="${node.claimType}">${claimTypeLabel(node.claimType)}</span>
      <button type="button" class="btn btn-secondary atlas-source" data-src-from="${node.src.from}" data-src-to="${node.src.to}" data-claim="${node.claimType}" data-title="${escapeHtml(node.termKo)}">원문 보기</button>
    </article>
  `).join("");

  panel.innerHTML = `
    <div class="overlay-header">
      <h2 class="term-serif">개념 지도 — Atlas</h2>
      <button type="button" class="btn btn-secondary" id="btn-close-atlas">닫기</button>
    </div>
    <p class="claim-type-note">획득한 개념과 <code>derivedFrom</code> 구성 관계를 사전 지정 좌표로 표시합니다.</p>
    ${model.nodes.length > 0 ? `
      <svg class="atlas-svg" viewBox="0 0 520 500" role="img" aria-label="획득한 개념과 구성 관계 지도">
        <defs><marker id="atlas-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"></path></marker></defs>
        ${edges}${nodes}
      </svg>
      <div class="atlas-list">${cards}</div>
    ` : '<p class="judgement-note">아직 획득한 개념이 없습니다. 리딩을 완료하면 지도가 채워집니다.</p>'}
  `;
  overlay.hidden = false;
  document.getElementById("btn-close-atlas").addEventListener("click", () => { overlay.hidden = true; });
  document.querySelectorAll(".atlas-source").forEach((el) => {
    el.addEventListener("click", () => openSourceOverlay({
      title: el.dataset.title,
      claimType: el.dataset.claim,
      src: { from: Number(el.dataset.srcFrom), to: Number(el.dataset.srcTo) },
    }));
  });
}

let sandboxDraft = { A: false, E: false, I: false, O: false };

function openSandbox() {
  const progress = getChapterProgress(CHAPTER_CONTENT.chapterId);
  sandboxDraft = cloneTruthVector(progress.sandboxLast || { A: false, E: false, I: false, O: false });
  renderSandboxOverlay();
  document.getElementById("overlay-sandbox").hidden = false;
}

function closeSandbox() {
  document.getElementById("overlay-sandbox").hidden = true;
}

function renderSandboxOverlay() {
  const overlay = document.getElementById("overlay-sandbox");
  const panel = overlay.querySelector(".overlay-panel");

  const relationRows = RELATION_IDS.map((id) => {
    const meta = RELATION_META[id];

  const ioRows = result.ioTable.map((row) => `
    <tr data-valid="${row.valid}">
      <td>${row.I ? "T" : "F"}</td><td>${row.O ? "T" : "F"}</td>
      <td>${escapeHtml(row.label)}</td>
    </tr>

  panel.innerHTML = `
    <div class="overlay-header">

    <p class="claim-type-note">여섯 관계를 모두 적용한 형식 모델의 귀결입니다. 보드의 카드 배치와는 별개의 가상 설정입니다.</p>
    <div class="sandbox-toggles" role="group" aria-label="가상 행위 진리값 설정">

        <label class="sandbox-toggle">

    <div class="sandbox-result" aria-live="polite">

        ${sourceButton}
      </div>
      <p class="sandbox-vector">설정 벡터: ⟨A=${result.truth.A ? "T" : "F"}, E=${result.truth.E ? "T" : "F"}, I=${result.truth.I ? "T" : "F"}, O=${result.truth.O ? "T" : "F"}⟩</p>
      ${result.consistent
        ? `<p class="judgement judgement-ok">정합 — ${escapeHtml(result.interpretation ? result.interpretation.label : "정합 벡터")}</p><p>${escapeHtml(result.interpretation ? result.interpretation.detail : "이 조합은 여섯 관계를 만족합니다.")}</p>`
        : `<p class="judgement judgement-violation">이 조합을 만족하는 행위는 존재할 수 없음</p><p>위반 관계: ${result.violatedRelations.map((id) => `${RELATION_META[id].label}(${RELATION_META[id].pairLabel})`).join(", ")}</p>`}
    </div>
    <div class="sandbox-relations">

      <p class="claim-type-note">I(가능)와 O(우연)는 함께 참일 수도 있지만, 둘 다 거짓일 수는 없습니다.</p>

/* ==== SECTION: UI-INQUIRY ==== */
function enterInquiry() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  if (progress.flowSteps[4] !== "done" || progress.flowSteps[5] === "inactive") {
    enterBattle();
    return;
  }
  showScreen("Inquiry");
  renderInquiryScreen();
}

function renderInquiryArgument(argument, selected, resolved) {
  const sideLabel = argument.side === "defense" ? "변호" : "반박";
  return `
    <article class="card argument-card" data-side="${argument.side}">
      <div class="argument-header">
        <span class="argument-side">${sideLabel}</span>
        <input type="checkbox" class="argument-check" value="${argument.id}" ${selected ? "checked" : ""} ${resolved ? "disabled" : ""}>
      </div>
      <p>${escapeHtml(argument.text)}</p>
      <div class="badge-row"><span class="badge-claim" data-claim="${argument.claimType}">${claimTypeLabel(argument.claimType)}</span></div>
      <button type="button" class="btn btn-secondary btn-source inquiry-source" data-src-from="${argument.src.from}" data-src-to="${argument.src.to}" data-claim="${argument.claimType}" data-title="${sideLabel} 논거">원문 보기</button>
    </article>
  `;
}

function renderInquiryScreen() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  const inquiry = content.inquiries[0];
  const state = getInquiryProgress(progress, inquiry);
  const resolved = state.status === "resolved";
  const argumentsById = new Map(content.arguments.map((argument) => [argument.id, argument]));
  const availableArguments = inquiry.argumentIds.map((id) => argumentsById.get(id)).filter(Boolean);
  const selectedCount = state.selectedArgumentIds.length;
  const noteLength = state.note.trim().length;
  const ready = resolved || (selectedCount >= 1 && noteLength >= 20);
  const sourceButton = `<button type="button" class="btn btn-secondary inquiry-source" data-src-from="${inquiry.src.from}" data-src-to="${inquiry.src.to}" data-claim="${inquiry.claimType}" data-title="내 의문 원문">원문 보기</button>`;

  document.getElementById("screen-inquiry").innerHTML = `
    <button type="button" class="back-link" id="btn-inquiry-battle">◂ 반례 배틀로 돌아가기</button>
    <h1>내 의문 노트 — 미결 사건</h1>
    <div class="screen-toolbar"><button type="button" class="btn btn-secondary" id="btn-inquiry-sandbox">Sandbox 열기</button></div>
    <article class="card inquiry-quote">
      <div class="overlay-header"><h2 class="term-serif">다룬 의문</h2><span class="badge-claim" data-claim="${inquiry.claimType}">${claimTypeLabel(inquiry.claimType)}</span>${sourceButton}</div>
      <blockquote>${escapeHtml(inquiry.quote)}</blockquote>
      <p class="src-range">원문 ${inquiry.src.from}–${inquiry.src.to}행</p>
    </article>
    <section class="card inquiry-workspace">
      <h2>논거를 선택하세요</h2>
      <p class="claim-type-note">변호와 반박 중 최소 한 장을 선택해야 사건을 정리할 수 있습니다.</p>
      <div class="argument-grid">${availableArguments.map((argument) => renderInquiryArgument(argument, state.selectedArgumentIds.includes(argument.id), resolved)).join("")}</div>
      <h2>나의 결론</h2>
      <textarea id="inquiry-note" class="inquiry-note" minlength="20" placeholder="Sandbox 조작 결과와 선택한 논거를 바탕으로 자신의 결론을 적어 보세요. (20자 이상)" ${resolved ? "disabled" : ""}>${escapeHtml(state.note)}</textarea>
      <div class="inquiry-requirements" aria-live="polite">
        <span>선택한 논거: ${selectedCount}장</span>
        <span>서술: ${noteLength}자 / 20자</span>
      </div>
      ${resolved ? '<p class="judgement judgement-ok">사건이 정리되었습니다. 다음은 결산 단계입니다.</p>' : `<button type="button" class="btn" id="btn-resolve-inquiry" ${ready ? "" : "disabled"}>사건 정리하기</button>`}
    </section>
    <div class="inquiry-nav"><button type="button" class="btn" id="btn-goto-summary" ${resolved ? "" : "disabled"}>결산으로</button></div>
  `;

  document.getElementById("btn-inquiry-battle").addEventListener("click", () => enterBattle());
  document.getElementById("btn-inquiry-sandbox").addEventListener("click", openSandbox);
  const summaryButton = document.getElementById("btn-goto-summary");
  if (summaryButton) summaryButton.addEventListener("click", () => enterSummary());
  document.querySelectorAll(".inquiry-source").forEach((el) => {
    el.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();
      openSourceOverlay({
        title: el.dataset.title,
        claimType: el.dataset.claim,
        src: { from: Number(el.dataset.srcFrom), to: Number(el.dataset.srcTo) },
      });
    });
  });
  document.querySelectorAll(".argument-check").forEach((el) => {
    el.addEventListener("change", () => {
      toggleInquiryArgument(progress, content, inquiry.id, el.value);
      renderInquiryScreen();
    });
  });
  const note = document.getElementById("inquiry-note");
  if (note) {
    note.addEventListener("input", () => {
      updateInquiryNote(progress, content, inquiry.id, note.value);
      const count = document.querySelector(".inquiry-requirements span:last-child");
      if (count) count.textContent = `서술: ${note.value.trim().length}자 / 20자`;
      const resolveButton = document.getElementById("btn-resolve-inquiry");
      if (resolveButton) resolveButton.disabled = !canResolveInquiry(progress, content, inquiry.id);
    });
  }
  const resolveButton = document.getElementById("btn-resolve-inquiry");
  if (resolveButton) resolveButton.addEventListener("click", () => {
    resolveInquiry(progress, content, inquiry.id);
    renderInquiryScreen();
  });
}

/* ==== SECTION: UI-SUMMARY ==== */
function showSaveBanner(message, isError = false) {
  const banner = document.getElementById("save-banner");
  banner.textContent = message;
  banner.dataset.error = isError ? "true" : "false";
  banner.hidden = false;
}

function downloadTextFile(filename, text, mimeType) {
  const blob = new Blob([text], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

function exportDoctrineMarkdown() {
  const progress = getChapterProgress(CHAPTER_CONTENT.chapterId);
  const generatedAt = new Date().toISOString();
  const markdown = buildDoctrineMarkdown(progress, CHAPTER_CONTENT, generatedAt);
  downloadTextFile("나의-정의론-3장.md", markdown, "text/markdown;charset=utf-8");
  showSaveBanner("「나의 정의론」 Markdown을 저장할 준비가 되었습니다.");
  return markdown;
}

function enterSummary() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  const inquiry = content.inquiries[0];
  const inquiryState = getInquiryProgress(progress, inquiry);
  if (inquiryState.status !== "resolved") {
    enterInquiry();
    return;
  }
  progress.status = "completed";
  progress.flowSteps[6] = "done";
  showScreen("Summary");
  renderSummaryScreen();
}

function renderSummaryScreen() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  const preview = buildDoctrineMarkdown(progress, content, new Date().toISOString());
  const screen = document.getElementById("screen-summary");
  screen.innerHTML = `
    <button type="button" class="back-link" id="btn-summary-home">◂ 서재</button>
    <h1>결산 — 나의 정의론</h1>
    <p class="summary-complete">6단계 흐름을 완주했습니다. 아래 문서는 원문 근거와 형식 모델의 지위를 함께 기록합니다.</p>
    <div class="summary-actions">
      <button type="button" class="btn" id="btn-download-markdown">Markdown 내보내기</button>
      <button type="button" class="btn btn-secondary" id="btn-download-state">진행 상태 JSON 저장</button>
    </div>
    <pre class="markdown-preview">${escapeHtml(preview)}</pre>
  `;
  document.getElementById("btn-summary-home").addEventListener("click", () => { showScreen("Home"); renderHome([]); });
  document.getElementById("btn-download-markdown").addEventListener("click", exportDoctrineMarkdown);
  document.getElementById("btn-download-state").addEventListener("click", () => {
    downloadTextFile("정의와-자연법-진행상태.json", serializeGameState(), "application/json;charset=utf-8");
    showSaveBanner("진행 상태 JSON을 저장할 준비가 되었습니다.");
  });
}

function wirePersistenceControls() {
  document.getElementById("nav-save-state").addEventListener("click", () => {
    downloadTextFile("정의와-자연법-진행상태.json", serializeGameState(), "application/json;charset=utf-8");
    showSaveBanner("진행 상태 JSON을 저장할 준비가 되었습니다.");
  });
  const loadButton = document.getElementById("nav-load-state");
  const fileInput = document.getElementById("file-load-state");
  loadButton.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    file.text().then((text) => {
      let data;
      try { data = JSON.parse(text); }
      catch (error) { showSaveBanner("상태 파일이 올바른 JSON이 아닙니다.", true); return; }
      const result = importGameStateData(data);
      if (!result.valid) { showSaveBanner(`상태 파일을 적용하지 않았습니다: ${result.reason}`, true); return; }
      showSaveBanner("진행 상태를 불러왔습니다.");
      showScreen("Home");
      renderHome([]);
    }).catch(() => showSaveBanner("상태 파일을 읽을 수 없습니다.", true));
    fileInput.value = "";
  });
}

/* ==== SECTION: UI-BOARD ==== */
let currentBoardStage = 1;
let referenceItemId = null;
let selectedTrayItemId = null;

function firstIncompleteStage(progress, content) {
  for (const s of content.stages) if (progress.stageStatus[s.stage] !== "cleared") return s.stage;
  return content.stages[content.stages.length - 1].stage;
}

function enterBoard() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  if (!isReadingComplete(progress, content)) {
    showScreen("Reading");
    renderReadingScreen();
    return;
  }
  if (progress.flowSteps[3] === "inactive") progress.flowSteps[3] = "active";
  currentBoardStage = firstIncompleteStage(progress, content);
  if (progress.stageStatus[currentBoardStage] === "inactive") progress.stageStatus[currentBoardStage] = "active";
  referenceItemId = null;
  selectedTrayItemId = null;
  showScreen("Board");
  renderBoardScreen();
}

function renderBoardScreen() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  const stage = getStageDef(content, currentBoardStage);
  const screen = document.getElementById("screen-board");

  tryClearStage(progress, content, currentBoardStage); // 멱등 — 매 렌더마다 안전하게 재확인

  const stageItems = stage.itemIds.map((id) => content.boardItems.find((b) => b.id === id));
  const trayItems = stageItems.filter((it) => progress.placements[it.id] === undefined);
  const quadrantContents = { A: [], E: [], I: [], O: [] };
  for (const it of stageItems) {
    const q = progress.placements[it.id];
    if (q) quadrantContents[q].push(it);
  }

  const referenceItem = stageItems.find((it) => it.id === referenceItemId) || null;
  const cleared = progress.stageStatus[currentBoardStage] === "cleared";
  const isLastStage = currentBoardStage === content.stages[content.stages.length - 1].stage;

  screen.innerHTML = `
    <button type="button" class="back-link" id="btn-board-home">◂ 서재</button>
    <h1>대당 사각형 보드 퍼즐</h1>
    <div class="screen-toolbar"><button type="button" class="btn btn-secondary" id="btn-open-sandbox">Sandbox 열기</button></div>
    <div class="stage-indicator">${currentBoardStage} / ${content.stages.length}단계 — 활성 관계 ${stage.activeRelations.length}개</div>
    <p class="stage-goal">${escapeHtml(stage.goal)}</p>

    <div class="board-layout">
      <div class="board-square" id="board-square">
        ${renderBoardSVG(referenceItem, stage.activeRelations)}
        ${renderQuadrant("A", "필연(A)", "의무", quadrantContents.A, stage.activeRelations)}
        ${renderQuadrant("E", "불가능(E)", "부정의·금지", quadrantContents.E, stage.activeRelations)}
        ${renderQuadrant("I", "가능(I)", "정의로운 것·허용", quadrantContents.I, stage.activeRelations)}
        ${renderQuadrant("O", "우연(O)", "의무 아닌 것", quadrantContents.O, stage.activeRelations)}
      </div>
      <div class="board-legend">
        <div><span class="legend-line" data-style="solid"></span> 반대(A–E)</div>
        <div><span class="legend-line" data-style="dashed"></span> 소반대(I–O)</div>
        <div><span class="legend-line" data-style="dotted"></span> 모순</div>
        <div><span class="legend-line" data-style="arrow"></span> 함축</div>
        <div class="legend-note">흐린 선 = 이 단계에서 비활성</div>
      </div>
    </div>

    <h3>카드 (탭하여 선택 → 사분면 탭하여 배치, 또는 드래그)</h3>
    <div class="board-tray">
      ${trayItems.map((it) => renderTrayCard(it)).join("") || '<p class="tray-empty">모든 카드가 배치되었습니다.</p>'}
    </div>

    <div id="placement-feedback" aria-live="polite">${referenceItem ? renderPlacementFeedback(referenceItem, progress, stage) : ""}</div>

    <div class="board-nav">
      <button type="button" class="btn" id="btn-stage-advance" ${cleared ? "" : "disabled"}>
        ${cleared ? (isLastStage ? "반례 배틀로" : "다음 단계") : "모든 카드를 정합하게 배치하세요"}
      </button>
    </div>
  `;

  wireBoardScreenEvents(progress, content, stage);
}

function renderBoardSVG(referenceItem, activeRelationIds) {
  const pos = { A: [100, 50], E: [300, 50], I: [100, 210], O: [300, 210] };
  const relEndpoints = {
    contrary_AE: ["A", "E"], subcontrary_IO: ["I", "O"],
    contradictory_AO: ["A", "O"], contradictory_EI: ["E", "I"],
    subalternation_AI: ["A", "I"], subalternation_EO: ["E", "O"],
  };
  const evalResult = referenceItem ? evaluate(referenceItem.truth, RELATION_IDS) : null;

  const lines = RELATION_IDS.map((rid) => {
    const meta = RELATION_META[rid];
    const [p1, p2] = relEndpoints[rid].map((q) => pos[q]);
    const active = activeRelationIds.includes(rid);
    let satisfied = "neutral";
    if (referenceItem && active) satisfied = evalResult[rid] ? "true" : "false";
    const markerAttr = meta.lineStyle === "arrow" ? 'marker-end="url(#arrowhead)"' : "";
    return `<line class="rel-line" data-style="${meta.lineStyle}" data-active="${active}" data-satisfied="${satisfied}"
      x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" ${markerAttr}>
      <title>${escapeHtml(meta.label)} (${meta.pairLabel}): ${escapeHtml(meta.condition)}</title>
    </line>`;
  }).join("");

  return `
    <svg class="board-lines" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="currentColor" />
        </marker>
      </defs>
      ${lines}
    </svg>
  `;
}

function renderQuadrant(q, modalLabel, lawLabel, items, activeRelationIds) {
  return `
    <div class="board-quadrant" data-quadrant="${q}" tabindex="0" role="button" aria-label="${escapeHtml(`${modalLabel} — ${lawLabel} 사분면`)}">
      <div class="quadrant-label"><span class="term-serif">${modalLabel}</span><br><small>${lawLabel}</small></div>
      <div class="quadrant-cards">
        ${items.map((it) => {
          const status = checkItemPlacement(it, q, activeRelationIds);
          return renderPlacedCard(it, status);
        }).join("")}
      </div>
    </div>
  `;
}

function renderPlacedCard(item, status) {
  const cls = status.consistent ? "consistent" : "inconsistent";
  const icon = status.consistent ? "✓" : "✗";
  return `
    <div class="card board-card ${cls}" data-item-id="${item.id}" data-placed="true" tabindex="0" role="button" aria-label="${escapeHtml(`${item.label} — ${status.consistent ? "정합" : "위반"} 배치`)}">
      <span class="board-card-icon">${icon}</span>
      <span class="board-card-label">${escapeHtml(item.label)}</span>
    </div>
  `;
}

function renderTrayCard(item) {
  const selected = selectedTrayItemId === item.id;
  return `<div class="card board-card tray-card ${selected ? "selected" : ""}" data-item-id="${item.id}" data-placed="false" tabindex="0" role="button" aria-pressed="${selected}">${escapeHtml(item.label)}</div>`;
}

function renderPlacementFeedback(item, progress, stage) {
  const quadrant = progress.placements[item.id];
  const trueQuadrants = trueQuadrantsOf(item);
  let html = `<div class="card feedback-card"><h4>${escapeHtml(item.label)}</h4>`;
  html += `<span class="badge-claim" data-claim="${item.claimType}">${claimTypeLabel(item.claimType)}</span>`;
  html += `<button type="button" class="btn btn-secondary btn-source feedback-source" data-src-from="${item.src.from}" data-src-to="${item.src.to}" data-claim="${item.claimType}" data-title="${escapeHtml(item.label)}">원문 보기</button>`;
  html += `<p class="rationale">${escapeHtml(item.rationale)}</p>`;
  if (quadrant) {
    const status = checkItemPlacement(item, quadrant, stage.activeRelations);
    if (status.consistent) {
      html += `<p class="judgement judgement-ok">채택된 모델에서의 귀결: ${quadrant} 배치는 정합입니다.</p>`;
      if (trueQuadrants.length > 1) {
        html += `<p class="judgement-note">이 행위는 ${trueQuadrants.join(", ")} 중 어느 쪽에 두어도 정합입니다. (복수 정합 — EC-11)</p>`;
      }
    } else {
      const violatedText = status.violated
        .map((rid) => `${RELATION_META[rid].label}(${RELATION_META[rid].pairLabel}): ${RELATION_META[rid].condition}`)
        .join(" / ");
      html += `<p class="judgement judgement-violation">채택된 모델에서의 귀결: ${quadrant} 배치는 위반입니다. 위반 관계 — ${escapeHtml(violatedText)}</p>`;
    }
  } else {
    html += `<p class="judgement-note">아직 배치되지 않았습니다.</p>`;
  }
  html += `</div>`;
  return html;
}

function wireBoardScreenEvents(progress, content, stage) {
  document.getElementById("btn-board-home").addEventListener("click", () => showScreen("Home"));
  document.getElementById("btn-open-sandbox").addEventListener("click", openSandbox);

  document.querySelectorAll(".feedback-source").forEach((el) => {
    el.addEventListener("click", () => openSourceOverlay({
      title: el.dataset.title,
      claimType: el.dataset.claim,
      src: { from: Number(el.dataset.srcFrom), to: Number(el.dataset.srcTo) },
    }));
  });

  const advanceBtn = document.getElementById("btn-stage-advance");
  advanceBtn.addEventListener("click", () => {
    const isLastStage = currentBoardStage === content.stages[content.stages.length - 1].stage;
    if (isLastStage) { enterBattle(); return; }
    currentBoardStage += 1;
    if (progress.stageStatus[currentBoardStage] === "inactive") progress.stageStatus[currentBoardStage] = "active";
    referenceItemId = null;
    selectedTrayItemId = null;
    renderBoardScreen();
  });

  function selectCard(itemId) {
    selectedTrayItemId = itemId;
    referenceItemId = itemId;
    renderBoardScreen();
  }
  function attemptPlaceAt(quadrant) {
    if (!selectedTrayItemId) return;
    placeCard(progress, selectedTrayItemId, quadrant);
    referenceItemId = selectedTrayItemId;
    selectedTrayItemId = null;
    renderBoardScreen();
  }

  document.querySelectorAll(".board-card").forEach((el) => {
    let dragging = false;
    let moved = false;
    let startX = 0, startY = 0;

    el.addEventListener("click", () => selectCard(el.dataset.itemId));
    el.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      selectCard(el.dataset.itemId);
    });

    el.addEventListener("pointerdown", (e) => {
      dragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    el.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      if (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6) {
        moved = true;
        el.classList.add("dragging");
      }
    });
    el.addEventListener("pointerup", (e) => {
      if (!dragging) return;
      dragging = false;
      el.classList.remove("dragging");
      if (!moved) return; // 단순 클릭은 click 리스너가 처리
      const target = document.elementFromPoint(e.clientX, e.clientY);
      const quadrantEl = target && target.closest && target.closest(".board-quadrant");
      if (quadrantEl) {
        placeCard(progress, el.dataset.itemId, quadrantEl.dataset.quadrant);
        referenceItemId = el.dataset.itemId;
        selectedTrayItemId = null;
        renderBoardScreen();
      }
    });
  });

  document.querySelectorAll(".board-quadrant").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest(".board-card")) return;
      attemptPlaceAt(el.dataset.quadrant);
    });
    el.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.preventDefault();
      attemptPlaceAt(el.dataset.quadrant);
    });
  });
}

/* ==== SECTION: UI-BATTLE ==== */
let battleFeedback = null;
function enterBattle() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  if (!canEnterBattle(progress, content)) {
    showScreen("Board");
    renderBoardScreen();
    return;
  }
  if (progress.flowSteps[4] === "inactive") progress.flowSteps[4] = "active";
  battleFeedback = null;
  showScreen("Battle");
  renderBattleScreen();
}

function renderBattleSourceButton(entity, title) {
  return `<button type="button" class="btn btn-secondary btn-source battle-source"
    data-src-from="${entity.src.from}" data-src-to="${entity.src.to}"
    data-claim="${entity.claimType}" data-title="${escapeHtml(title)}">원문 보기</button>`;
}

function renderPremiseBattleCard(premise, progress, content) {
  const defeated = progress.defeatedPremises.includes(premise.id);
  const cards = content.counterexamples.filter((cx) =>
    cx.defeats === premise.id && progress.acquiredCounterexamples.includes(cx.id)
  );
  return `
    <article class="card premise-card" data-defeated="${defeated}">
      <div class="premise-header">
        <p class="premise-text">${escapeHtml(premise.text)}</p>
        <span class="premise-state" data-state="${defeated ? "defeated" : "standing"}">${defeated ? "붕괴" : "유지 중"}</span>
      </div>
      <div class="badge-row">
        <span class="badge-claim" data-claim="${premise.claimType}">${claimTypeLabel(premise.claimType)}</span>
        ${renderBattleSourceButton(premise, "전제")}
      </div>
      ${defeated ? "" : `
        <div class="counterexample-actions">
          ${cards.length > 0 ? cards.map((cx) => `
            <span class="counterexample-action-group">
              <button type="button" class="btn counterexample-button" data-counterexample-id="${cx.id}">
                반례 사용: ${escapeHtml(cx.label)}
              </button>
              <button type="button" class="btn btn-secondary btn-source battle-source" data-src-from="${cx.src.from}" data-src-to="${cx.src.to}" data-claim="${cx.claimType}" data-title="${escapeHtml(cx.label)}">원문</button>
            </span>
          `).join("") : '<span class="judgement-note">현재 획득한 이 전제의 반례 카드가 없습니다.</span>'}
        </div>
      `}
      ${defeated ? `<p class="counterexample-explain"><strong>전제를 무너뜨렸습니다.</strong> ${escapeHtml(cards[0] ? cards[0].explain : "적중한 반례의 설명을 확인할 수 없습니다.")}</p>` : ""}
    </article>
  `;
}

function renderBattleScreen() {
  const content = CHAPTER_CONTENT;
  const progress = getChapterProgress(content.chapterId);
  const collapsed = tryCompleteBattle(progress, content);
  const inquiryAvailable = progress.flowSteps[5] !== "inactive";
  const screen = document.getElementById("screen-battle");
  const propositionBlocks = content.propositions.map((proposition) => {
    const status = getPropositionStatus(progress, proposition);
    const premiseCards = proposition.premiseIds
      .map((premiseId) => content.premises.find((premise) => premise.id === premiseId))
      .filter(Boolean)
      .map((premise) => renderPremiseBattleCard(premise, progress, content))
      .join("");
    return `
      <article class="card proposition-card">
        <div class="overlay-header">
          <h2 class="term-serif">상대 명제</h2>
          <span class="badge-claim" data-claim="${proposition.claimType}">${claimTypeLabel(proposition.claimType)}</span>
          ${renderBattleSourceButton(proposition, "상대 명제")}
        </div>
        <p class="proposition-claim">${escapeHtml(proposition.claim)}</p>
        <div class="battle-status" data-state="${status.collapsed ? "collapsed" : "standing"}">
          ${status.collapsed ? "✓ 명제 붕괴" : `전제 ${status.defeatedPremiseIds.length} / ${proposition.premiseIds.length}개 붕괴`}
        </div>
        <div class="premise-list">${premiseCards}</div>
      </article>
    `;
  }).join("");

  screen.innerHTML = `
    <button type="button" class="back-link" id="btn-battle-board">◂ 보드로 돌아가기</button>
    <h1>반례 배틀</h1>
    <p class="battle-intro">획득한 반례 카드를 전제에 적중시켜, 명제를 지지하는 모든 전제를 검토하세요.</p>
    <div class="battle-grid">${propositionBlocks}</div>
    <div id="battle-feedback" class="card battle-feedback" aria-live="polite">
      ${battleFeedback || (collapsed ? '<p class="judgement judgement-ok">모든 지지 전제가 붕괴했습니다. 명제는 더 이상 유지되지 않습니다.</p>' : '<p class="judgement-note">각 전제 아래의 반례를 선택하면 적중 결과와 설명이 표시됩니다.</p>')}
    </div>
    <div class="battle-nav">
      <button type="button" class="btn btn-secondary" id="btn-battle-board-bottom">보드로</button>
      <button type="button" class="btn" id="btn-battle-inquiry" ${inquiryAvailable ? "" : "disabled"}>미결 사건으로</button>
    </div>
  `;

  document.getElementById("btn-battle-board").addEventListener("click", () => enterBoard());
  document.getElementById("btn-battle-board-bottom").addEventListener("click", () => enterBoard());
  const inquiryButton = document.getElementById("btn-battle-inquiry");
  if (inquiryButton) inquiryButton.addEventListener("click", () => enterInquiry());
  document.querySelectorAll(".battle-source").forEach((el) => {
    el.addEventListener("click", () => openSourceOverlay({
      title: el.dataset.title,
      claimType: el.dataset.claim,
      src: { from: Number(el.dataset.srcFrom), to: Number(el.dataset.srcTo) },
    }));
  });
  document.querySelectorAll("[data-counterexample-id]").forEach((el) => {
    el.addEventListener("click", () => {
      const result = useCounterexample(progress, content, el.dataset.counterexampleId);
      const feedback = document.getElementById("battle-feedback");
      if (!result.success) {
        feedback.innerHTML = `<p class="judgement judgement-violation">반례를 사용할 수 없습니다: ${escapeHtml(result.reason)}</p>`;
        return;
      }
      const premise = content.premises.find((item) => item.id === result.premiseId);
      const cx = content.counterexamples.find((item) => item.id === el.dataset.counterexampleId);
      battleFeedback = `<p class="judgement judgement-ok">${escapeHtml(cx.label)}가 「${escapeHtml(premise.text)}」에 적중했습니다.</p><p>${escapeHtml(result.explanation)}</p>`;
      renderBattleScreen();
    });
  });
}

/* ==== SECTION: BOOTSTRAP ==== */
(function bootstrap() {
  const failures = runContentSelfCheck(CHAPTER_CONTENT, SOURCE_TEXT);
  if (!verifySourceHash(CHAPTER_CONTENT, SOURCE_TEXT)) {
    failures.unshift({ code: "C-3", message: "sourceHash가 내장 원문에서 계산한 해시와 일치하지 않습니다." });
  }
  wirePersistenceControls();
  renderHome(failures);
})();
</script>
